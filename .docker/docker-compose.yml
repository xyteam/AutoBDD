version: '3.5'
services:

  # autobdd-base — L0 (OS + essentials) + L0d (X display + desktop) + L1 (screen engine).
  # Screen-only capable; no browser/wdio. Contract: docs/CONTRACT.md.
  autobdd-base:
    build:
      context: ${PWD}/..
      dockerfile: .docker/autobdd-base.dockerfile
      args:
        AUTOBDD_VERSION: ${AUTOBDD_VERSION}
    image: "xyteam/autobdd-base:${AUTOBDD_VERSION}"
    container_name: autobdd-base

  # autobdd-framework — the product: base + L2 (Chrome/chromedriver, Node, wdio, cucumber,
  # AutoBDD). Published also as the deprecated alias xyteam/autobdd:${AUTOBDD_VERSION}.
  autobdd-framework:
    build:
      context: ${PWD}/..
      dockerfile: .docker/autobdd-framework.dockerfile
      args:
        AUTOBDD_VERSION: ${AUTOBDD_VERSION}
    image: "xyteam/autobdd-framework:${AUTOBDD_VERSION}"
    container_name: autobdd-framework

  # dev container for developing autobdd test (runs on the product image)
  autobdd-dev:
    image: "xyteam/autobdd-framework:${AUTOBDD_VERSION}"
    container_name: autobdd-dev
    shm_size: 1536M
    user: root
    privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:delegated
      - ${HOME}/${ProjectsBase:-Projects}:/home/${USER}/Projects:delegated
    ports:
      - "5922:5900"
      - "2222:22"
      - "8022:8000"
    environment:
      - USER=${USER}
      - USERID=${USERID}
      - GROUPID=${GROUPID}
      - HOSTOS=${HOSTOS}
      - PASSWORD=${PASSWORD}
      - VNC_PASSWORD=${VNC_PASSWORD}
      - RESOLUTION=1920x1200x24
      - ABDD_PROJECT=${ABDD_PROJECT}
    entrypoint: "/root/autobdd-dev.startup.sh"

  # run container for running autobdd test (on the product image)
  autobdd-run:
    image: "xyteam/autobdd-framework:${AUTOBDD_VERSION}"
    container_name: autobdd-run
    shm_size: 1536M
    user: root
    privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:delegated
    environment:
      - USER=${USER}
      - USERID=${USERID}
      - GROUPID=${GROUPID}
      - HOSTOS=${HOSTOS}
      - ABDD_PROJECT=${ABDD_PROJECT}
    entrypoint: "/root/autobdd-run.startup.sh"

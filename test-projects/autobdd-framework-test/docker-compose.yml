# run test only
# docker-compose run --rm autobdd-framework-test-run "xvfb-runner.sh make test-all"
#
# test development
# docker-compose up -d autobdd-framework-test-dev
# docker-compose logs -f autobdd-framework-test-dev
# ssh -o StrictHostKeyChecking=no $USER@localhost -p 2224
# default password is "ubuntu"
# in container ssh: make test-all
# vnc localhost:5924
# docker-compose down
#
# DEV-MODE: mount the working-tree AutoBDD (this monorepo root) over the image's baked
# copy so autobdd-framework-test runs against live AutoBDD source instead of the stale image.
#   * This file lives at <AutoBDD>/test-projects/autobdd-framework-test/, so AUTOBDD_SRC defaults
#     to ../.. (the AutoBDD monorepo root). Override it to point at another checkout:
#     AUTOBDD_SRC=/abs/path/to/AutoBDD docker-compose ...
#   * Patched startup scripts (dev/*.startup.sh) are bind-mounted over the image's
#     baked copies; they skip the node_modules refresh when AUTOBDD_DEV_MOUNT=1 so the
#     working tree's own node_modules (wdio 7) is never clobbered by the image's (wdio 6).
services:

  # dev container for developing autobdd test
  autobdd-framework-test-dev:
    image: "xyteam/autobdd:${AutoBDD_Ver}"
    container_name: autobdd-framework-test-dev
    shm_size: 512M
    user: root
    privileged: true
    security_opt:
      - "apparmor=docker-default"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - ${AUTOBDD_SRC:-../..}:/home/${USER}/Projects/AutoBDD:rw
      - ${PWD}:/home/${USER}/Projects/AutoBDD/test-projects/${ABDD_PROJECT}:rw
      - ${PWD}/dev/autobdd-dev.startup.sh:/root/autobdd-dev.startup.sh:ro
    ports:
      - "5924:5900"
      - "2224:22"
      - "8004:8000"
    environment:
      - USER=${USER}
      - ABDD_PROJECT=${ABDD_PROJECT}
      - AUTOBDD_DEV_MOUNT=1
      - HOSTOS=${HOSTOS}
      - USERID=${USERID}
      - GROUPID=${GROUPID}
      - PASSWORD=${PASSWORD}
      - VNC_PASSWORD=${VNC_PASSWORD}
      - RESOLUTION=1920x1200x24
    entrypoint: "/root/autobdd-dev.startup.sh"

  # run container for running autobdd test
  autobdd-framework-test-run:
    image: "xyteam/autobdd:${AutoBDD_Ver}"
    container_name: autobdd-framework-test-run
    shm_size: 512M
    user: root
    privileged: true
    security_opt:
      - "apparmor=docker-default"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - ${AUTOBDD_SRC:-../..}:/home/${USER}/Projects/AutoBDD:rw
      - ${PWD}:/home/${USER}/Projects/AutoBDD/test-projects/${ABDD_PROJECT}:rw
      - ${PWD}/dev/autobdd-run.startup.sh:/root/autobdd-run.startup.sh:ro
    environment:
      - USER=${USER}
      - ABDD_PROJECT=${ABDD_PROJECT}
      - AUTOBDD_DEV_MOUNT=1
      - HOSTOS=${HOSTOS}
      - USERID=${USERID}
      - GROUPID=${GROUPID}
    entrypoint: "/root/autobdd-run.startup.sh"

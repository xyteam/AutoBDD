# Docker (baked) mode — standalone. Run autobdd-framework-test purely off the local
# xyteam/autobdd:<AutoBDD_Ver> image. No working-tree AutoBDD mount, no
# AUTOBDD_DEV_MOUNT: the startup copies the image's baked framework to
# ~/Projects/AutoBDD, which sets FrameworkPath + framework/scripts on PATH.
#
#   AutoBDD_Ver=3.0.0 ABDD_PROJECT=autobdd-framework-test \
#     docker compose -f docker-compose.docker.yml run --rm autobdd-framework-test-run \
#       "xvfb-runner.sh make clean e2e-test"
services:
  autobdd-framework-test-run:
    image: "xyteam/autobdd:${AutoBDD_Ver}"
    container_name: autobdd-framework-test-run
    shm_size: 512M
    user: root
    privileged: true
    security_opt:
      - "apparmor=docker-default"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - ${PWD}:/home/${USER}/Projects/AutoBDD/test-projects/${ABDD_PROJECT}:rw
      - ${PWD}/dev/autobdd-run.startup.sh:/root/autobdd-run.startup.sh:ro
    environment:
      - USER=${USER}
      - ABDD_PROJECT=${ABDD_PROJECT}
      - HOSTOS=${HOSTOS:-Linux}
      - USERID=${USERID:-1000}
      - GROUPID=${GROUPID:-1000}
      - PASSWORD=${PASSWORD:-ubuntu}
      # wdio9 launches chromedriver from this baked system binary instead of
      # downloading it into /tmp (which races to corruption under parallel workers).
      - CHROMEDRIVER_PATH=/usr/local/bin/chromedriver
    entrypoint: "/root/autobdd-run.startup.sh"
